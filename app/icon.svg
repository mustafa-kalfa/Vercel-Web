<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Sekme ikonu: "Hadith and Digital" icin H + D monogrami.
    Harfler <text> yerine geometrik yol/dikdortgen olarak cizildi;
    favicon render edilirken yazi tipi garantisi yok. Govdeler kalin ve
    kenar bosluklari dar tutuldu: ikon sekmede 16px'e kadar kuculuyor,
    ince cizgiler o boyutta kayboluyor.
    Renkler site paletinden: koyu zemin + zeminin bej tonu.
  -->
  <rect width="32" height="32" rx="7" fill="#171717" />
  <g fill="#d2ccbe">
    <!-- H -->
    <rect x="3" y="7" width="3.6" height="18" />
    <rect x="11.4" y="7" width="3.6" height="18" />
    <rect x="3" y="14.2" width="12" height="3.6" />
    <!-- D: dis hat ve ic bosluk tek yolda, evenodd ile bosluk oyuluyor -->
    <path
      fill-rule="evenodd"
      d="M17.5 7h3.5a9 9 0 0 1 0 18h-3.5V7zm3.6 3.6v10.8h.4a5.4 5.4 0 0 0 0-10.8h-.4z"
    />
  </g>
</svg>
